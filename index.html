       CONTAINER
    ===================================================== */

    .container {

      width: 100%;

      max-width: 700px;

      margin:
        35px auto;

      padding:

    }


    /* =====================================================
       LINK LIST
    ===================================================== */

    .link-list {

      display: flex;

      flex-direction: column;

      gap: 16px;

    }


    .link-button {

      position: relative;

      display: block;

      width: 100%;

      padding:
        18px 22px;

      background: white;

      color: #333;

      text-decoration: none;

      border-radius: 14px;

      border:
        1px solid #e0e0e0;

      box-shadow:
        0 3px 10px
        rgba(0, 0, 0, 0.08);

      transition:
        transform 0.2s,
        box-shadow 0.2s,
        background 0.2s;

    }


    .link-button:hover {

      transform:
        translateY(-2px);

      background:
        #fff5f5;

      box-shadow:
        0 6px 16px
        rgba(183, 28, 28, 0.15);

    }


    .link-title-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      position: relative;

      z-index: 5;

    }


    .link-title {

      font-size: 19px;

      font-weight: 600;

    }


    .arrow {

      color: #c62828;

      font-size: 28px;

      font-weight: 700;

      line-height: 1;

    }


    /* =====================================================
       🎉 CARD แสดงความยินดี
    ===================================================== */

    .celebration {

      background:
        linear-gradient(
          135deg,
          #fffdf0,
          #fff8d6,
          #ffffff
        );

      border:
        2px solid #ffd54f;

      animation:
        celebrationPulse 1.5s infinite;

      overflow: visible;

    }


    @keyframes celebrationPulse {

      0%,
      100% {

        transform:
          scale(1);

        box-shadow:
          0 3px 12px
          rgba(255, 193, 7, 0.25);

      }

      50% {

        transform:
          scale(1.012);

        box-shadow:
          0 8px 28px
          rgba(255, 193, 7, 0.55);

      }

    }


    /* =====================================================
       🎆 CANVAS พลุ
    ===================================================== */

    .fireworks-container {

      position: absolute;

      top: -90px;

      left: -80px;

      right: -80px;

      bottom: -90px;

      pointer-events: none;

      overflow: visible;

      z-index: 1;

    }


    .fireworks-canvas {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      pointer-events: none;

    }


    /* =====================================================
       🎊 ข้อความแสดงความยินดี
    ===================================================== */

    .celebration-message {

      position: absolute;

      left: 50%;

      bottom: -34px;

      transform:
        translateX(-50%);

      z-index: 6;

      white-space: nowrap;

      font-size: 14px;

      font-weight: 600;

      color: #b8860b;

      opacity: 0.9;

    }


    /* =====================================================
       ✨ ประกาย
    ===================================================== */

    .celebration-sparkle {

      position: absolute;

      pointer-events: none;

      z-index: 4;

      font-size: 18px;

      animation:
        sparkleFloat 2s infinite ease-in-out;

    }


    .sparkle-1 {

      left: 5%;

      top: 15%;

      animation-delay: 0s;

    }


    .sparkle-2 {

      right: 7%;

      top: 20%;

      animation-delay: 0.5s;

    }


    .sparkle-3 {

      left: 12%;

      bottom: 12%;

      animation-delay: 1s;

    }


    .sparkle-4 {

      right: 15%;

      bottom: 15%;

      animation-delay: 1.5s;

    }


    @keyframes sparkleFloat {

      0%,
      100% {

        opacity: 0.25;

        transform:
          scale(0.7)
          rotate(0deg);

      }

      50% {

        opacity: 1;

        transform:
          scale(1.3)
          rotate(20deg);

      }

    }


    /* =====================================================
       DEADLINE
    ===================================================== */

    .deadline-box {

      margin-top: 10px;

      padding-top: 10px;

      border-top:
        1px solid #eeeeee;

      position: relative;

    /* เลยกำหนด */

    /* =====================================================
       เอฟเฟกต์กระพริบ
    ===================================================== */

    @keyframes blinkWarning {

      100% {

        bottom: -65px;

      }


      .celebration-message {

        font-size: 12px;

        bottom: -28px;

      }

    }

  </style>

    /* =====================================================
       แปลงวันที่เป็นภาษาไทย
    ===================================================== */

    function formatThaiDate(
      date
    ) {

      const months = [

        "ม.ค.",
        "ก.พ.",
        "มี.ค.",
        "เม.ย.",
        "พ.ค.",
        "มิ.ย.",
        "ก.ค.",
        "ส.ค.",
        "ก.ย.",
        "ต.ค.",
        "พ.ย.",
        "ธ.ค."

      ];


      const day =
        date.getDate();


      const month =
        months[
          date.getMonth()
        ];


      const year =
        date.getFullYear()
        + 543;


      const hour =
        String(
          date.getHours()
        ).padStart(2, "0");


      const minute =
        String(
          date.getMinutes()
        ).padStart(2, "0");


      return (
        day
        + " "
        + month
        + " "
        + year
        + " เวลา "
        + hour
        + ":"
        + minute
        + " น."
      );

    }



    /* =====================================================
       คำนวณสถานะกำหนดส่ง
    ===================================================== */

    function getDeadlineStatus(
      deadline
    ) {

      const now =
        new Date();


      const target =
        new Date(
          deadline
        );


      const diff =
        target.getTime()
        - now.getTime();


      if (
        diff <= 0
      ) {

        return {

          text:
            "🔴 เลยกำหนดส่งแล้ว",

          className:
            "status-expired"

        };

      }


      const hours =
        diff
        /
        (
          1000
          * 60
          * 60
        );


      if (
        hours <= 24
      ) {

        return {

          text:
            "🔴 ใกล้ถึงกำหนดส่งมาก",

          className:
            "status-danger"

        };

      }


      if (
        hours <= 72
      ) {

        return {

          text:
            "🔴 ใกล้ถึงกำหนดส่ง",

          className:
            "status-warning"

        };

      }


      return {

        text:
          "🟢 ยังไม่ถึงกำหนดส่ง",

        className:
          "status-normal"

      };

    }



    /* =====================================================
       สร้าง Canvas พลุ
    ===================================================== */

    function createFireworks(
      card
    ) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "fireworks-container";


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.className =
        "fireworks-canvas";


      wrapper.appendChild(
        canvas
      );


      /* ประกาย */

      const sparklePositions = [

        "sparkle-1",
        "sparkle-2",
        "sparkle-3",
        "sparkle-4"

      ];


      sparklePositions.forEach(
        function(className) {

          const sparkle =
            document.createElement(
              "div"
            );

          sparkle.className =
            "celebration-sparkle "
            +
            className;

          sparkle.textContent =
            "✨";

          wrapper.appendChild(
            sparkle
          );

        }
      );


      /* ข้อความ */

      const message =
        document.createElement(
          "div"
        );


      message.className =
        "celebration-message";


      message.textContent =
        "🎉 ขอแสดงความยินดี 🎉";


      wrapper.appendChild(
        message
      );


      card.appendChild(
        wrapper
      );


      const ctx =
        canvas.getContext(
          "2d"
        );


      let width = 0;
      let height = 0;


      function resizeCanvas() {

        const rect =
          wrapper.getBoundingClientRect();


        width =
          Math.max(
            1,
            rect.width
          );


        height =
          Math.max(
            1,
            rect.height
          );


        const ratio =
          window.devicePixelRatio
          || 1;


        canvas.width =
          width * ratio;


        canvas.height =
          height * ratio;


        canvas.style.width =
          width + "px";


        canvas.style.height =
          height + "px";


        ctx.setTransform(
          ratio,
          0,
          0,
          ratio,
          0,
          0
        );

      }


      resizeCanvas();


      window.addEventListener(
        "resize",
        resizeCanvas
      );


      /* =================================================
         พลุ
      ================================================= */

      const rockets = [];

      const particles = [];


      function random(
        min,
        max
      ) {

        return (
          Math.random()
          *
          (
            max - min
          )
          +
          min
        );

      }


      function createRocket() {

        rockets.push({

          x:
            random(
              width * 0.15,
              width * 0.85
            ),

          y:
            height + 10,

          targetY:
            random(
              height * 0.12,
              height * 0.55
            ),

          speed:
            random(
              4,
              7
            ),

          hue:
            random(
              0,
              360
            ),

          trail: []

        });

      }


      function explode(
        rocket
      ) {

        const count =
          Math.floor(
            random(
              45,
              75
            )
          );


        for (
          let i = 0;
          i < count;
          i++
        ) {

          const angle =
            (
              Math.PI * 2
            )
            *
            (
              i / count
            )
            +
            random(
              -0.08,
              0.08
            );


          const speed =
            random(
              1.5,
              4.5
            );


          particles.push({

            x:
              rocket.x,

            y:
              rocket.y,

            vx:
              Math.cos(angle)
              * speed,

            vy:
              Math.sin(angle)
              * speed,

            life:
              1,

            decay:
              random(
                0.012,
                0.022
              ),

            size:
              random(
                1,
                2.5
              ),

            hue:
              rocket.hue
              +
              random(
                -25,
                25
              )

          });

        }

      }


      let lastLaunch =
        performance.now();


      let nextLaunch =
        random(
          900,
          1800
        );


      function animate(
        time
      ) {

        ctx.clearRect(
          0,
          0,
          width,
          height
        );


        /* ===============================
           สร้างพลุใหม่
        =============================== */

        if (
          time
          -
          lastLaunch
          >
          nextLaunch
        ) {

          createRocket();

          lastLaunch =
            time;

          nextLaunch =
            random(
              900,
              1800
            );

        }


        /* ===============================
           จรวด
        =============================== */

        for (
          let i =
            rockets.length - 1;
          i >= 0;
          i--
        ) {

          const rocket =
            rockets[i];


          rocket.y -=
            rocket.speed;


          rocket.trail.push({

            x:
              rocket.x,

            y:
              rocket.y

          });


          if (
            rocket.trail.length
            >
            8
          ) {

            rocket.trail.shift();

          }


          /* หางพลุ */

          for (
            let j = 0;
            j <
            rocket.trail.length;
            j++
          ) {

            const point =
              rocket.trail[j];


            ctx.beginPath();


            ctx.arc(
              point.x,
              point.y,
              1.3,
              0,
              Math.PI * 2
            );


            ctx.fillStyle =
              "hsla("
              +
              rocket.hue
              +
              ",100%,70%,"
              +
              (
                j /
                rocket.trail.length
              )
              +
              ")";


            ctx.fill();

          }


          /* ระเบิด */

          if (
            rocket.y
            <=
            rocket.targetY
          ) {

            explode(
              rocket
            );

            rockets.splice(
              i,
              1
            );

          }

        }


        /* ===============================
           อนุภาค
        =============================== */

        for (
          let i =
            particles.length - 1;
          i >= 0;
          i--
        ) {

          const particle =
            particles[i];


          particle.x +=
            particle.vx;


          particle.y +=
            particle.vy;


          particle.vy +=
            0.035;


          particle.vx *=
            0.985;


          particle.vy *=
            0.985;


          particle.life -=
            particle.decay;


          if (
            particle.life
            <=
            0
          ) {

            particles.splice(
              i,
              1
            );

            continue;

          }


          /* แสงเรือง */

          ctx.beginPath();


          ctx.arc(
            particle.x,
            particle.y,
            particle.size * 3,
            0,
            Math.PI * 2
          );


          ctx.fillStyle =
            "hsla("
            +
            particle.hue
            +
            ",100%,65%,"
            +
            (
              particle.life * 0.15
            )
            +
            ")";


          ctx.fill();


          /* จุดหลัก */

          ctx.beginPath();


          ctx.arc(
            particle.x,
            particle.y,
            particle.size,
            0,
            Math.PI * 2
          );


          ctx.fillStyle =
            "hsla("
            +
            particle.hue
            +
            ",100%,75%,"
            +
            particle.life
            +
            ")";


          ctx.fill();

        }


        requestAnimationFrame(
          animate
        );

      }


      requestAnimationFrame(
        animate
      );


      /* พลุลูกแรก */

      setTimeout(
        function() {

          createRocket();

        },
        500
      );

    }



    /* =====================================================
       สร้างรายการลิงก์
    ===================================================== */

    function loadLinks() {


      const container =
        document.getElementById(
          "linkList"
        );


      container.innerHTML = "";


      links.forEach(
        function(link) {


          if (
            !link.title
            ||
            !link.url
          ) {

            return;

          }


          const a =
            document.createElement(
              "a"
            );


          a.className =
            "link-button";


          /* =================================================
             🎉 รายการแสดงความยินดี
          ================================================= */

          if (
            link.celebration
          ) {

            a.classList.add(
              "celebration"
            );

          }


          a.href =
            link.url;


          a.target =
            "_blank";


          a.rel =
            "noopener noreferrer";



          /* =================================================
             ชื่อหัวข้อ
          ================================================= */

          const titleRow =
            document.createElement(
              "div"
            );


          titleRow.className =
            "link-title-row";


          const title =
            document.createElement(
              "div"
            );


          title.className =
            "link-title";


          title.textContent =
            link.title;


          const arrow =
            document.createElement(
              "div"
            );


          arrow.className =
            "arrow";


          arrow.textContent =
            "›";


          titleRow.appendChild(
            title
          );


          titleRow.appendChild(
            arrow
          );


          a.appendChild(
            titleRow
          );



          /* =================================================
             กำหนดส่ง
          ================================================= */

          if (
            link.deadlineText
            ||
            link.deadline
          ) {


            const deadlineBox =
              document.createElement(
                "div"
              );


            deadlineBox.className =
              "deadline-box";



            /* ข้อความกำหนดส่ง */

            if (
              link.deadlineText
            ) {

              const text =
                document.createElement(
                  "div"
                );


              text.className =
                "deadline-text";


              text.textContent =
                "📌 "
                +
                link.deadlineText;


              deadlineBox.appendChild(
                text
              );

            }



            /* วันและเวลา */

            if (
              link.deadline
            ) {


              const date =
                new Date(
                  link.deadline
                );


              const time =
                document.createElement(
                  "div"
                );


              time.className =
                "deadline-time";


              time.textContent =
                "⏰ กำหนดส่ง "
                +
                formatThaiDate(
                  date
                );


              deadlineBox.appendChild(
                time
              );



              /* สถานะ */

              const status =
                getDeadlineStatus(
                  link.deadline
                );


              const statusElement =
                document.createElement(
                  "div"
                );


              statusElement.className =
                "deadline-status "
                +
                status.className;


              statusElement.textContent =
                status.text;


              deadlineBox.appendChild(
                statusElement
              );

            }


            a.appendChild(
              deadlineBox
            );

          }


          container.appendChild(
            a
          );


          /* =================================================
             🎆 เริ่มระบบพลุ
          ================================================= */

          if (
            link.celebration
          ) {

            createFireworks(
              a
            );

          }


        }
      );

    }



    /* =====================================================
       โหลดหน้าเว็บ
    ===================================================== */

    loadLinks();


  </script>

</body>

</html>
