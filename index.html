
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>กิจกรรมส่งเสริมกระบวนการชุมชนแห่งการเรียนรู้ทางวิชาชีพ
เพื่อพัฒนาจรรยาบรรณวิชาชีพผ่านระบบเทคโนโลยีสารสนเทศ
(Ethics in Professional Learning Community : E-PLC) ประจําปี 2569</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Sarabun", sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .header {
      background: linear-gradient(135deg, #b71c1c, #e53935);
      color: white;
      text-align: center;
      padding: 32px 20px 36px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 17px;
      opacity: 0.95;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .link-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-button {
      display: flex;
      align-items: center;
      justify-content: space-between;

      width: 100%;
      min-height: 72px;

      padding: 16px 22px;

      background: white;
      color: #333;

      text-decoration: none;

      border-radius: 14px;
      border: 1px solid #e0e0e0;

      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);

      font-size: 19px;
      font-weight: 600;

      transition:
        transform 0.2s,
        box-shadow 0.2s,
        background 0.2s;
    }

    .link-button:hover {
      transform: translateY(-2px);
      background: #fff5f5;
      box-shadow: 0 6px 16px rgba(183, 28, 28, 0.15);
    }

    .link-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .arrow {
      color: #c62828;
      font-size: 24px;
      font-weight: 700;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin: 35px 0 25px;
    }

    @media (max-width: 600px) {

      .header {
        padding: 25px 15px 28px;
      }

      .header h1 {
        font-size: 24px;
      }

      .header p {
        font-size: 15px;
      }

      .container {
        margin-top: 25px;
        padding: 0 15px;
      }

      .link-button {
        min-height: 65px;
        padding: 14px 17px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>กิจกรรมส่งเสริมกระบวนการชุมชนแห่งการเรียนรู้ทางวิชาชีพ
เพื่อพัฒนาจรรยาบรรณวิชาชีพผ่านระบบเทคโนโลยีสารสนเทศ
(Ethics in Professional Learning Community : E-PLC) ประจําปี 2569</h1>
    <p>โรงเรียนมหาชนะชัยวิทยาคม</p>
  </div>


  <div class="container">

    <div id="linkList" class="link-list"></div>

    <div class="footer">
      โรงเรียนมหาชนะชัยวิทยาคม
    </div>

  </div>


  <script>

    /* =====================================================
       แก้ไขลิงก์ตรงส่วนนี้
       
       สามารถแก้ได้ทั้ง
       1. title = ชื่อหัวข้อ
       2. url   = URL ของลิงก์

       ไม่ต้องแก้ส่วนอื่นของโค้ด
    ===================================================== */

    const links = [

      {
        title: "📄คู่มือการใช้แพลตฟอร์ม",
        url: "https://drive.google.com/drive/folders/1OiJXDgL2pugoB9YDue4JytZH8yP6LJ-o?usp=sharing"
      },

      {
        title: "📊 ลิงก์เข้าอบรมและส่งงานในแพลตฟอร์ม",
        url: "https://khuruplatform.ksp.or.th/_/login"
      },

      {
        title: "📚 แบบฟอร์มชิ้นงานที่ 1- 5",
        url: "https://drive.google.com/drive/folders/1gm5NLeF8byi3i3PTL8UuKPV-_lT1fEwD?usp=sharing"
      },

      {
        title: "📝 ส่งชิ้นงานที่ 1-5 ส่งในแพลตฟอร์มและในไดรฟ์โรงเรียน",
        url: "https://drive.google.com/drive/folders/1jd6_Swhd3Btgh7buPkDvsoi2pPM2BSiO?usp=sharing"
      },

      {
        title: "📌 ตรวจสอบรายชื่อการส่งงาน",
        url: "https://docs.google.com/spreadsheets/d/1F3aNVNA6qeMIQi7qGBPMhvpbOJHzx3q_RMwea5Scq9A/edit?usp=sharing"
      }

    ];


    /* =====================================================
       สร้างปุ่มลิงก์
    ===================================================== */

    function loadLinks() {

      const container =
        document.getElementById("linkList");

      container.innerHTML = "";

      links.forEach(function(link) {

        if (
          !link.title ||
          !link.url
        ) {
          return;
        }

        const a =
          document.createElement("a");

        a.className = "link-button";

        a.href = link.url;

        a.target = "_blank";

        a.rel = "noopener noreferrer";


        const title =
          document.createElement("div");

        title.className = "link-title";

        title.textContent =
          link.title;


        const arrow =
          document.createElement("div");

        arrow.className = "arrow";

        arrow.textContent = "›";


        a.appendChild(title);

        a.appendChild(arrow);

        container.appendChild(a);

      });

    }


    /* =====================================================
       เริ่มต้นหน้าเว็บ
    ===================================================== */

    loadLinks();

  </script>

</body>
</html>
